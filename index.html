AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADGrJTyf5J93UquHD3vAAAAAElFTkSuQmCC';
    const BRAND_PRIMARY = '#29382B';
    const SENDER = { name: 'Flirt Drinks Inc.', line1: '20-473B boul. St-René E', line2: 'Gatineau, QC J8P 8A5' };

    function getData() {
      const p = new URLSearchParams(location.search);
      return {
        poNumber: (p.get('po') || '').trim() || 'INCONNU',
        customerName: (p.get('customer') || '').trim(),
        deliveryAddress: (p.get('addr') || '').trim(),
        palletCount: parseInt(p.get('pallets') || '0', 10),
        shipDate: (p.get('ship') || '').trim(),
      };
    }

    function todayISO() {
      const d = new Date();
      const z = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
    }

    function hexToRgb(hex) {
      const h = String(hex).replace('#', '');
      return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
    }

    function pdfBlock(doc, y, label, name, addrLines, gray, M, CONTENT_W) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(gray[0], gray[1], gray[2]);
      doc.text(label, M, y);
      y += 0.26;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(0, 0, 0);
      const nameLines = doc.splitTextToSize(String(name || ''), CONTENT_W);
      doc.text(nameLines, M, y);
      y += 0.24 * nameLines.length + 0.06;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(0, 0, 0);
      (addrLines || []).forEach(function (ln) {
        if (!ln) return;
        const wrapped = doc.splitTextToSize(String(ln), CONTENT_W);
        doc.text(wrapped, M, y);
        y += 0.19 * wrapped.length;
      });
      return y;
    }

    function renderLabel(doc, d, palletNum, total, primary, gray, printDate) {
      const PAGE_W = 4, M = 0.15, CONTENT_W = PAGE_W - 2 * M, PAGE_H = 6;
      const logoH = 0.55, logoW = logoH * (2575 / 1190);
      try { doc.addImage(LOGO, 'PNG', M, M, logoW, logoH); } catch (e) {}
      doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(0, 0, 0);
      doc.text('PALETTE ' + palletNum + ' / ' + total, PAGE_W - M, M + 0.42, { align: 'right' });
      doc.setDrawColor(primary[0], primary[1], primary[2]); doc.setLineWidth(0.03);
      let y = M + 0.55 + 0.12;
      doc.line(M, y, PAGE_W - M, y);
      y += 0.32;
      y = pdfBlock(doc, y, 'EXPÉDITEUR / FROM', SENDER.name, [SENDER.line1, SENDER.line2], gray, M, CONTENT_W);
      y += 0.16;
      const addrLines = String(d.deliveryAddress || '').split('\n');
      pdfBlock(doc, y, 'DESTINATAIRE / TO', d.customerName, addrLines, gray, M, CONTENT_W);
      const boxTop = 4.6, boxH = 0.85;
      doc.setDrawColor(primary[0], primary[1], primary[2]); doc.setLineWidth(0.022);
      doc.rect(M, boxTop, CONTENT_W, boxH);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(primary[0], primary[1], primary[2]);
      doc.text('PO #', PAGE_W / 2, boxTop + 0.24, { align: 'center' });
      doc.setFontSize(26); doc.setTextColor(0, 0, 0);
      doc.text(String(d.poNumber), PAGE_W / 2, boxTop + 0.64, { align: 'center' });
      const dy = PAGE_H - M - 0.04;
      doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.006);
      doc.line(M, dy - 0.13, PAGE_W - M, dy - 0.13);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(gray[0], gray[1], gray[2]);
      doc.text('Expédition : ' + (d.shipDate || 'À confirmer'), M, dy);
      doc.text('Imprimé : ' + printDate, PAGE_W - M, dy, { align: 'right' });
    }

    function buildPdf(d) {
      const ctor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;
      if (!ctor) throw new Error('jsPDF pas chargé (vérifie la connexion internet).');
      const doc = new ctor({ unit: 'in', format: [4, 6], orientation: 'portrait' });
      const primary = hexToRgb(BRAND_PRIMARY);
      const gray = [85, 85, 85];
      const printDate = todayISO();
      const total = d.palletCount;
      for (let i = 1; i <= total; i++) {
        if (i > 1) doc.addPage([4, 6], 'portrait');
        renderLabel(doc, d, i, total, primary, gray, printDate);
      }
      return doc;
    }

    function downloadPdf() {
      const status = document.getElementById('status');
      const d = getData();
      if (!d.palletCount || d.palletCount < 1) {
        status.innerHTML = '<span class="err">Nombre de palettes manquant ou invalide. Remplis « Number of Pallets » sur la commande.</span>';
        return;
      }
      try {
        status.textContent = 'Génération du PDF 4x6...';
        const doc = buildPdf(d);
        const fname = 'Etiquettes_PO_' + String(d.poNumber).replace(/[^A-Za-z0-9_-]/g, '_') + '.pdf';
        try {
          doc.save(fname);
          status.textContent = 'Téléchargé : ' + fname + '  →  Fichiers > clic droit > Ouvrir avec > Print Go.';
        } catch (e1) {
          window.open(doc.output('bloburl'), '_blank');
          status.textContent = 'PDF ouvert dans un onglet. Télécharge-le, puis Fichiers > Ouvrir avec > Print Go.';
        }
      } catch (e) {
        status.innerHTML = '<span class="err">Erreur : ' + e.message + '</span>';
      }
    }

    // On load: show a confirmation card so the user sees what will print.
    (function () {
      const d = getData();
      const prev = document.getElementById('preview');
      if (!d.palletCount || d.palletCount < 1) {
        prev.innerHTML = '<div class="card"><h2>PROBLÈME</h2><div class="row err">Nombre de palettes manquant. Remplis « Number of Pallets » sur la commande avant de cliquer le bouton.</div></div>';
        return;
      }
      prev.innerHTML =
        '<div class="card">' +
        '<h2>ÉTIQUETTES À GÉNÉRER</h2>' +
        '<div class="row"><b>PO #</b>' + (d.poNumber) + '</div>' +
        '<div class="row"><b>Client</b>' + (d.customerName || '—') + '</div>' +
        '<div class="row"><b>Adresse</b>' + (d.deliveryAddress.replace(/\n/g, ', ') || '—') + '</div>' +
        '<div class="row"><b>Palettes</b>' + d.palletCount + ' étiquette(s)</div>' +
        '<div class="row"><b>Expédition</b>' + (d.shipDate || 'À confirmer') + '</div>' +
        '</div>';
    })();
  </script>
</body>
</html>
